# Builds installers for Windows (.exe setup), macOS (.dmg) and Linux (.tar.gz with install.sh).
# Run it from the Actions tab ("Build installers"), or push a tag like v1.0.0 to publish a GitHub Release.
name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write   # needed to create the GitHub Release and upload the installers
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon (arm64); macos-15-intel = Intel (x86_64) Macs
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./build_windows.ps1
      - if: runner.os != 'Windows'
        run: bash build_unix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Wyrm-${{ matrix.os }}
          path: |
            dist/*Setup*.exe
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  # One release job, after all three builds, so there is no 3-way race to create the same release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Wyrm ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
