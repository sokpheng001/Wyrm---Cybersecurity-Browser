# Automatic releases: every push to wyrm-browser builds Windows (.exe setup), macOS Apple Silicon + Intel
# (.dmg) and Linux (.tar.gz). Only if ALL builds succeed is it released, with the next version number
# (latest release + 1, e.g. 0.0.1 -> 0.0.2) stamped into the app, so installed copies show "Update".
# Older releases are removed so only the newest stays. Put "[skip release]" in a commit message to skip,
# or run it manually from the Actions tab ("Build installers").
name: Build installers
on:
  push:
    branches: [wyrm-browser]
  workflow_dispatch:
permissions:
  contents: write   # create the release + tag, upload installers, remove old releases
concurrency:
  group: release    # one release at a time, in push order
  cancel-in-progress: false
jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        name: Next version (latest release tag + 1, never below the version in wyrm/__init__.py)
        run: |
          git fetch --tags --force
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, subprocess
          tags = subprocess.run(["git", "tag", "-l", "v*"], capture_output=True, text=True).stdout.split()
          vers = [tuple(map(int, m.groups())) for t in tags if (m := re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", t))]
          code = tuple(map(int, re.search(r'__version__ = "(\d+)\.(\d+)\.(\d+)"',
                                          open("wyrm/__init__.py", encoding="utf-8").read()).groups()))
          nxt = (max(vers)[0], max(vers)[1], max(vers)[2] + 1) if vers else code
          nxt = max(nxt, code)
          print("version=%d.%d.%d" % nxt)
          PY
          cat "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon (arm64); macos-15-intel = Intel (x86_64) Macs
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Stamp version ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          python - "${{ needs.version.outputs.version }}" <<'PY'
          import re, sys
          v = sys.argv[1]
          for path, pat, rep in (("wyrm/__init__.py", r'__version__ = "[^"]*"', f'__version__ = "{v}"'),
                                 ("installer/windows.iss", r'#define AppVersion "[^"]*"', f'#define AppVersion "{v}"')):
              s = open(path, encoding="utf-8").read()
              open(path, "w", encoding="utf-8").write(re.sub(pat, rep, s, count=1))
          print("stamped", v)
          PY
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./build_windows.ps1
      - if: runner.os != 'Windows'
        run: bash build_unix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Wyrm-${{ matrix.os }}
          path: |
            dist/*Setup*.exe
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  # Runs only when every build above succeeded ("good"), so a broken push is never released.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "What's new (commit titles since the previous release; shown in the app's Update tooltip)"
        run: |
          git fetch --tags --force
          prev=$(git tag -l 'v*' --sort=-v:refname | head -1)
          {
            echo "## What's new in Wyrm Browser v$VERSION"
            echo
            if [ -n "$prev" ]; then range="$prev..${{ github.sha }}"; else range="-15 ${{ github.sha }}"; fi
            git log $range --no-merges --format='- %s' | grep -v -i 'skip release' | head -30
          } > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Wyrm Browser v${{ needs.version.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: dist/*
      - name: Keep only the newest release
        run: |
          gh release list --limit 200 --json tagName -q '.[].tagName' | while read -r t; do
            if [ "$t" != "v$VERSION" ]; then gh release delete "$t" --yes --cleanup-tag; fi
          done
