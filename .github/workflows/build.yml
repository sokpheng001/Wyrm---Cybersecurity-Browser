# Automatic releases: every push to wyrm-browser builds Windows (.exe setup), macOS Apple Silicon + Intel
# (.dmg) and Linux (.tar.gz). Only if ALL builds succeed is it released. The version shown to users comes from
# wyrm/__init__.py (e.g. 0.0.1); each release also gets a build number (the GitHub run number, always
# increasing), so installed copies see a newer build of the same version and show "Update".
# The release replaces the previous one, so only the newest stays. Put "[skip release]" in a commit message to skip,
# or run it manually from the Actions tab ("Build installers").
name: Build installers
on:
  push:
    branches: [wyrm-browser]
  workflow_dispatch:
permissions:
  contents: write   # create the release + tag, upload installers, remove old releases
concurrency:
  group: release    # one release at a time, in push order
  cancel-in-progress: false
jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: v
        name: Version from wyrm/__init__.py + build number (GitHub run number)
        run: |
          v=$(sed -n 's/^__version__ = "\([0-9.]*\)".*/\1/p' wyrm/__init__.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # +100: the repo moved (old repo reached build 39); run numbers restarted at 1, builds must keep growing
          echo "build=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon (arm64); macos-15-intel = Intel (x86_64) Macs
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}   # empty = no code signing (see below)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Stamp version ${{ needs.version.outputs.version }} build ${{ needs.version.outputs.build }}
        shell: bash
        run: |
          python - "${{ needs.version.outputs.version }}" "${{ needs.version.outputs.build }}" <<'PY'
          import re, sys
          v, b = sys.argv[1], sys.argv[2]
          for path, pat, rep in (("wyrm/__init__.py", r'__version__ = "[^"]*"', f'__version__ = "{v}"'),
                                 ("wyrm/__init__.py", r'__build__ = \d+', f'__build__ = {b}'),
                                 ("installer/windows.iss", r'#define AppVersion "[^"]*"', f'#define AppVersion "{v}"')):
              s = open(path, encoding="utf-8").read()
              open(path, "w", encoding="utf-8").write(re.sub(pat, rep, s, count=1))
          print("stamped", v, "build", b)
          PY
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64
      - if: runner.os == 'Windows'
        shell: pwsh
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./build_windows.ps1
      - if: runner.os != 'Windows'
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: bash build_unix.sh
      # Optional Windows code signing through SignPath Foundation (free for open-source projects). Skipped until
      # the repo has the secret SIGNPATH_API_TOKEN and the variables SIGNPATH_ORGANIZATION_ID and
      # SIGNPATH_PROJECT_SLUG (and optionally SIGNPATH_SIGNING_POLICY_SLUG; default "release-signing").
      - name: Upload the unsigned installer for signing
        id: unsigned
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with: { name: unsigned-windows, path: dist/*Setup*.exe, if-no-files-found: error }
      - name: Sign the installer (SignPath)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed
      - name: Use the signed installer
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item dist-signed\*Setup*.exe dist\ -Force
      - uses: actions/upload-artifact@v7
        with:
          name: Wyrm-${{ matrix.os }}
          path: |
            dist/*Setup*.exe
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  # Runs only when every build above succeeded ("good"), so a broken push is never released.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: "What's new: CHANGELOG.md section for this version + this build's commits (release text and Update tooltip)"
        run: |
          git fetch --tags --force
          prev=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$prev" ]; then range="$prev..${{ github.sha }}"; else range="-15 ${{ github.sha }}"; fi
          commits=$(git log $range --no-merges --format='- %s' | grep -v -i 'skip release' | head -30 || true)
          {
            echo "## What's new in Wyrm Browser v$VERSION (build $BUILD)"
            echo
            awk -v h="## v$VERSION" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/^[[:space:]]*$/d'
            if [ -n "$commits" ]; then
              echo
              echo "### Also in this build"
              echo
              echo "$commits"
            fi
            echo
            echo "<!-- wyrm-build: $BUILD -->"
          } > notes.md
          cat notes.md
      - uses: actions/download-artifact@v8
        with: { path: dist, pattern: "Wyrm-*", merge-multiple: true }   # not the unsigned-windows artifact
      - run: ls -R dist
      # SHA-256 of every download in the release notes; plus a VirusTotal scan of the Windows installer when the
      # repo has the secret VT_API_KEY (free VirusTotal account). A failed scan upload never blocks the release.
      - name: Checksums and VirusTotal scan link (release notes)
        env: { VT_API_KEY: "${{ secrets.VT_API_KEY }}" }
        run: |
          {
            echo
            echo "### SHA-256 checksums"
            echo
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
          } >> notes.md
          exe=$(ls dist/*Setup*.exe 2>/dev/null | head -1)
          if [ -n "$VT_API_KEY" ] && [ -n "$exe" ]; then
            if url=$(curl -sf -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -er .data) \
               && curl -sf -H "x-apikey: $VT_API_KEY" -F "file=@$exe" "$url" >/dev/null; then
              sha=$(sha256sum "$exe" | cut -d' ' -f1)
              echo >> notes.md
              echo "Virus scan of the Windows installer: [VirusTotal](https://www.virustotal.com/gui/file/$sha)" >> notes.md
            else
              echo "::warning::VirusTotal upload failed; releasing without the scan link"
            fi
          fi
          cat notes.md
      # Upload everything to a hidden draft first, and publish only once every installer is there: installed
      # copies never see a half-uploaded release (no Update button until its installer can be downloaded).
      # A draft creates no git tag, so it uses a temporary name until it is published as v$VERSION.
      - name: Upload installers to a draft release
        run: |
          gh release create "v$VERSION-build$BUILD" dist/* --draft --target "${{ github.sha }}" \
            --title "Wyrm Browser v$VERSION (build $BUILD)" --notes-file notes.md
      - name: Publish (replaces the previous release; the version tag moves to this build)
        run: |
          gh release list --limit 200 --json tagName,isDraft -q '.[] | select(.isDraft|not) | .tagName' |
            while read -r t; do gh release delete "$t" --yes --cleanup-tag; done
          git push origin ":refs/tags/v$VERSION" 2>/dev/null || true
          gh release edit "v$VERSION-build$BUILD" --tag "v$VERSION" --target "${{ github.sha }}" --draft=false --latest
      - name: Keep only the newest release (also drafts left by failed runs)
        run: |
          gh release list --limit 200 --json tagName -q '.[].tagName' | while read -r t; do
            if [ "$t" != "v$VERSION" ]; then gh release delete "$t" --yes --cleanup-tag; fi
          done
