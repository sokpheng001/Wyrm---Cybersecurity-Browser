<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Wyrm — "W" wordmark with cybersecurity motifs (hex-shield frame, circuit traces, terminal cursor).
       Transparent background: no tile. -->
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a9bff"/><stop offset="1" stop-color="#0f62fe"/>
    </linearGradient>
  </defs>

  <!-- cyber deco: hexagon security frame + circuit traces -->
  <g opacity="0.38" stroke="#4f93ff" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 36 L204 80 L204 168 L128 212 L52 168 L52 80 Z"/>
    <path d="M128 36 V18"/><circle cx="128" cy="16" r="3.4" fill="#4f93ff" stroke="none"/>
    <path d="M204 80 L226 67"/><circle cx="228" cy="66" r="3.4" fill="#4f93ff" stroke="none"/>
    <path d="M204 168 L226 181"/><circle cx="228" cy="182" r="3.4" fill="#4f93ff" stroke="none"/>
    <path d="M52 168 L30 181"/><circle cx="28" cy="182" r="3.4" fill="#4f93ff" stroke="none"/>
    <path d="M52 80 L30 67"/><circle cx="28" cy="66" r="3.4" fill="#4f93ff" stroke="none"/>
  </g>

  <!-- bold W -->
  <path d="M60 84 L90 180 L128 120 L166 180 L196 84"
        fill="none" stroke="url(#w)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- red terminal cursor -->
  <rect x="150" y="188" width="28" height="11" rx="2" fill="#da1e28"/>
</svg>
