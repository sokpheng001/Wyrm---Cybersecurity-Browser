<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Wyrm — wordmark/monogram icon: bold "W" + red terminal cursor. Blue + red, dark tile. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1430"/><stop offset="1" stop-color="#121216"/>
    </linearGradient>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f93ff"/><stop offset="1" stop-color="#0f62fe"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <!-- bold W -->
  <path d="M54 78 L88 182 L128 116 L168 182 L202 78"
        fill="none" stroke="url(#w)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- red terminal cursor -->
  <rect x="150" y="190" width="30" height="12" rx="2" fill="#da1e28"/>
</svg>
